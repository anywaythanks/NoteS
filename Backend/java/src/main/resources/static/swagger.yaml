openapi: "3.0.3"
info:
  title: "NoteS API"
  version: "v 0.0.1"
servers:
  - url: "{scheme}://{domain}:{port}/{context}"
    description: Resource server
    variables:
      scheme:
        enum:
          - 'http'
          - 'https'
        default: 'http'
      domain:
        enum:
          - 'localhost'
          - 'notes.fvds.ru'
        default: 'localhost'
      port:
        enum:
          - '8080'
          - '9080'
          - '9180'
          - '5267'
          - '8443'
          - '80'
          - '443'
        default: '5267'
      context:
        enum:
          - ''
          - 'server'
        default: ''
components:
  schemas:
    AddTagRequestDto:
      type: object
      properties:
        name:
          type: string
          nullable: true
      additionalProperties: false
    CommentCreateRequestDto:
      required:
        - syntax_name
      type: object
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        syntax_name:
          "$ref": "#/components/schemas/SyntaxTypeName"
        content:
          type: string
          nullable: true
      additionalProperties: false
    CommentCreateResponseDto:
      required:
        - note_type
        - syntax_name
      type: object
      properties:
        path:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        note_type:
          "$ref": "#/components/schemas/NoteTypeName"
        is_public:
          type: boolean
        syntax_name:
          "$ref": "#/components/schemas/SyntaxTypeName"
        content:
          type: string
          nullable: true
      additionalProperties: false
    CommentEditRequestDto:
      required:
        - syntax_name
      type: object
      properties:
        title:
          type: string
          nullable: true
        syntax_name:
          "$ref": "#/components/schemas/SyntaxTypeName"
        content:
          type: string
          nullable: true
      additionalProperties: false
    CommentEditResponseDto:
      required:
        - note_type
        - syntax_name
      type: object
      properties:
        path:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        note_type:
          "$ref": "#/components/schemas/NoteTypeName"
        is_public:
          type: boolean
        syntax_name:
          "$ref": "#/components/schemas/SyntaxTypeName"
        content:
          type: string
          nullable: true
      additionalProperties: false
    CreateTagRequestDto:
      type: object
      properties:
        name:
          type: string
          nullable: true
        color:
          maximum: 16777215
          minimum: 0
          type: integer
          format: int32
      additionalProperties: false
    NoteCreateRequestDto:
      required:
        - syntax_name
      type: object
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        syntax_name:
          "$ref": "#/components/schemas/SyntaxTypeName"
        content:
          type: string
          nullable: true
      additionalProperties: false
    NoteCreateResponseDto:
      required:
        - note_type
        - syntax_name
      type: object
      properties:
        path:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        note_type:
          "$ref": "#/components/schemas/NoteTypeName"
        is_public:
          type: boolean
        syntax_name:
          "$ref": "#/components/schemas/SyntaxTypeName"
      additionalProperties: false
    NoteEditContentResponseDto:
      required:
        - syntax_name
      type: object
      properties:
        title:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        syntax_name:
          "$ref": "#/components/schemas/SyntaxTypeName"
      additionalProperties: false
    NoteEditOnlyContentRequestDto:
      type: object
      properties:
        content:
          type: string
          nullable: true
        syntax_name:
          "$ref": "#/components/schemas/SyntaxTypeName"
      additionalProperties: false
    NoteEditOtherRequestDto:
      type: object
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
      additionalProperties: false
    NoteEditOtherResponseDto:
      required:
        - syntax_name
      type: object
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        syntax_name:
          "$ref": "#/components/schemas/SyntaxTypeName"
      additionalProperties: false
    NoteEditPublicRequestDto:
      type: object
      properties:
        is_public:
          type: boolean
      additionalProperties: false
    NoteEditPublicResponseDto:
      type: object
      properties:
        title:
          type: string
          nullable: true
        is_public:
          type: boolean
      additionalProperties: false
    NoteSearchContentResponseDto:
      required:
        - note_type
      type: object
      properties:
        title:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        owner_account_name:
          type: string
          nullable: true
        main_note_path:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        score:
          type: number
          format: double
        note_type:
          "$ref": "#/components/schemas/NoteTypeName"
        tags:
          type: array
          items:
            "$ref": "#/components/schemas/TagResponseDto"
          nullable: true
        is_public:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    NoteSearchContentResponseDtoPageDto:
      required:
        - items
        - total
        - total_pages
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/NoteSearchContentResponseDto"
          nullable: true
        total_pages:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
      additionalProperties: false
    NoteTypeName:
      enum:
        - NOTE
        - COMMENT
        - COMMENT_REDACTED
      type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    SyntaxTypeName:
      enum:
        - PLAINTEXT
        - MARKDOWN
      type: string
    TagResponseDto:
      type: object
      properties:
        name:
          type: string
          nullable: true
        color:
          maximum: 16777215
          minimum: 0
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: oauth2
      description: API использует [OAuth2 authorizationCode](https://auth0.com/docs/get-started/authentication-and-authorization-flow/authorization-code-flow).
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/NoteS/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/realms/NoteS/protocol/openid-connect/token
          scopes:
            read: Balea Server HTTP Api
security:
  - Bearer: [ ]
paths:
  "/api/private/{accountName}/notes/{pathNote}/publish":
    patch:
      tags:
        - PrivateNote
      description: Редактирование свойства публичности любой заметки или комментария
      parameters:
        - name: accountName
          in: path
          required: true
          schema:
            maxLength: 128
            type: string
        - name: pathNote
          in: path
          required: true
          schema:
            maxLength: 128
            minLength: 3
            type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NoteEditPublicRequestDto"
          text/json:
            schema:
              "$ref": "#/components/schemas/NoteEditPublicRequestDto"
          application/*+json:
            schema:
              "$ref": "#/components/schemas/NoteEditPublicRequestDto"
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                "$ref": "#/components/schemas/NoteEditPublicResponseDto"
            application/json:
              schema:
                "$ref": "#/components/schemas/NoteEditPublicResponseDto"
            text/json:
              schema:
                "$ref": "#/components/schemas/NoteEditPublicResponseDto"
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
            application/json:
